apiVersion: v1
kind: Service
metadata:
  name: proxy-ailb
  namespace: marchproxy
  labels:
    app.kubernetes.io/name: marchproxy
    app.kubernetes.io/component: proxy-ailb
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: marchproxy
    app.kubernetes.io/component: proxy-ailb
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: grpc
    port: 50051
    targetPort: 50051
  - name: metrics
    port: 9090
    targetPort: 9090
