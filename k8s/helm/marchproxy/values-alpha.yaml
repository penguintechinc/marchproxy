# Alpha environment overrides (local MicroK8s)
namespace: marchproxy-alpha
replicaCount: 1
image:
  pullPolicy: Never
env:
  LOG_LEVEL: DEBUG
  RELEASE_MODE: "false"
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: marchproxy.localhost.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: marchproxy-alpha-tls
      hosts:
        - marchproxy.localhost.local
