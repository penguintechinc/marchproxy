[pytest]
# Pytest configuration for MarchProxy Manager

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Async support
asyncio_mode = auto

# Output options
addopts =
    -v
    --strict-markers
    --cov=.
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-report=term-missing
    --cov-fail-under=90
    --cov-omit=tests/*,migrations/*,__pycache__/*,venv/*,virtualenv/*
    --maxfail=10
    --tb=short

# Markers
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests requiring DB/Redis
    slow: Slow running tests
    requires_db: Requires database connection
    requires_redis: Requires Redis connection

# Coverage options
[coverage:run]
source = .
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*
    */virtualenv/*
    setup.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
