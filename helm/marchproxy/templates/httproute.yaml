{{- if .Values.httproute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "marchproxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "marchproxy.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httproute.gatewayName }}
      namespace: {{ .Values.httproute.gatewayNamespace }}
      sectionName: https
  hostnames:
    - {{ .Values.httproute.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      backendRefs:
        - name: {{ include "marchproxy.manager.fullname" . }}
          port: 8000
{{- end }}
