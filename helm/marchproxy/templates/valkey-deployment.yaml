{{- if .Values.redis.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "marchproxy.fullname" . }}-valkey
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: valkey
    app.kubernetes.io/name: {{ include "marchproxy.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.redis.master.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.redis.master.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "marchproxy.fullname" . }}-valkey
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: valkey
    app.kubernetes.io/name: {{ include "marchproxy.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: valkey
      app.kubernetes.io/name: {{ include "marchproxy.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: valkey
        app.kubernetes.io/name: {{ include "marchproxy.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
      - name: valkey
        image: valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
        imagePullPolicy: IfNotPresent
        command:
        - valkey-server
        - --requirepass
        - $(VALKEY_PASSWORD)
        - --appendonly
        - "yes"
        env:
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "marchproxy.fullname" . }}-secrets
              key: redis-password
        ports:
        - name: valkey
          containerPort: 6379
          protocol: TCP
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          {{- toYaml .Values.redis.master.resources | nindent 10 }}
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "marchproxy.fullname" . }}-valkey
{{- end }}
---
{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "marchproxy.fullname" . }}-redis-master
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: valkey
    app.kubernetes.io/name: {{ include "marchproxy.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
  - name: valkey
    port: 6379
    targetPort: valkey
    protocol: TCP
  selector:
    app.kubernetes.io/component: valkey
    app.kubernetes.io/name: {{ include "marchproxy.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
