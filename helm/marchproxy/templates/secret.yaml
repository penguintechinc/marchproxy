{{- if .Values.secrets.manage }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "marchproxy.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "marchproxy.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  database-url: {{ printf "postgresql://marchproxy:%s@%s-postgresql:5432/marchproxy" .Values.secrets.postgresPassword (include "marchproxy.fullname" .) | quote }}
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  redis-url: {{ printf "redis://default:%s@%s-redis-master:6379" .Values.secrets.redisPassword (include "marchproxy.fullname" .) | quote }}
  cluster-api-key: {{ .Values.secrets.clusterApiKey | quote }}
  redis-password: {{ .Values.secrets.redisPassword | quote }}
  {{- if .Values.secrets.openaiApiKey }}
  openai-api-key: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
{{- end }}
