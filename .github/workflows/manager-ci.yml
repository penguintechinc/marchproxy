name: Manager CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'manager/**'
      - '.version'
      - '.github/workflows/manager-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'manager/**'
      - '.version'
      - '.github/workflows/manager-ci.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: marchproxy/manager

jobs:
  lint-and-test:
    name: Lint and Test Manager
    runs-on: ubuntu-latest
    outputs:
      epoch64: ${{ steps.timestamp.outputs.epoch64 }}
      version: ${{ steps.version.outputs.version }}
      full_version: ${{ steps.version.outputs.full_version }}
    defaults:
      run:
        working-directory: ./manager

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Generate epoch64 timestamp
      id: timestamp
      run: |
        EPOCH64=$(date +%s)
        echo "epoch64=$EPOCH64" >> $GITHUB_OUTPUT
        echo "Epoch64 timestamp: $EPOCH64"

    - name: Detect version from .version file
      id: version
      run: |
        if [ -f ../.version ]; then
          VERSION=$(cat ../.version | tr -d '[:space:]')
          SEMVER=$(echo "$VERSION" | cut -d'.' -f1-3)
        else
          VERSION="0.0.0"
          SEMVER="0.0.0"
        fi
        echo "version=$SEMVER" >> $GITHUB_OUTPUT
        echo "full_version=$VERSION" >> $GITHUB_OUTPUT
        echo "Detected version: $SEMVER (full: $VERSION)"

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: 'manager/requirements*.txt'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Format check with black
      run: |
        black --check --diff .

    - name: Type check with mypy
      run: |
        mypy . --ignore-missing-imports || true

    - name: Run unit tests
      run: |
        python -m pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v6
      with:
        file: ./manager/coverage.xml
        flags: manager
        name: manager-coverage

  security-scan:
    name: Security Scan Manager
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install safety bandit pip-audit

    - name: Run safety check
      run: |
        safety check -r requirements.txt --json --output safety-report.json || true
        cat safety-report.json

    - name: Run bandit security linter
      run: |
        bandit -r . -f json -o bandit-report.json || true
        cat bandit-report.json

    - name: Run pip-audit
      run: |
        pip-audit --desc --format=json --output=audit-report.json || true
        cat audit-report.json

  build-and-test:
    name: Build and Integration Test Manager
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan]

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

    - name: Build manager image
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
      with:
        context: ./manager
        file: ./manager/Dockerfile
        target: production
        push: false
        tags: ${{ env.IMAGE_NAME }}:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run manager container tests
      run: |
        # Start test database
        docker run -d --name test-postgres \
          -e POSTGRES_DB=marchproxy_test \
          -e POSTGRES_USER=test \
          -e POSTGRES_PASSWORD=test \
          -p 5432:5432 \
          postgres:15-alpine

        # Wait for database
        sleep 10

        # Run manager with test configuration
        docker run --rm \
          --link test-postgres:postgres \
          -e DATABASE_URL=postgresql://test:test@postgres:5432/marchproxy_test \
          -e DEBUG=true \
          ${{ env.IMAGE_NAME }}:test \
          python -m pytest tests/ -v

        # Cleanup
        docker stop test-postgres
        docker rm test-postgres

  build-platform:
    name: Build Production Manager Image - ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main'

    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Set up QEMU
      uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

    - name: Log in to Container Registry
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf  # v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Determine platform tag
      id: platform-tag
      run: |
        PLATFORM_TAG=$(echo "${{ matrix.platform }}" | sed 's|/|-|g')
        echo "tag=${PLATFORM_TAG}" >> $GITHUB_OUTPUT

    - name: Build and push manager image
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
      with:
        context: ./manager
        file: ./manager/Dockerfile
        target: production
        platforms: ${{ matrix.platform }}
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ steps.platform-tag.outputs.tag }}
        cache-from: type=gha,scope=${{ github.job }}-${{ matrix.platform }}
        cache-to: type=gha,scope=${{ github.job }}-${{ matrix.platform }},mode=max

  merge-manifests:
    name: Merge Manager Manifests
    runs-on: ubuntu-latest
    needs: [build-platform]
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Log in to Container Registry
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

    - name: Create manifest
      run: |
        docker buildx imagetools create \
          -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-linux-amd64 \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-linux-arm64

  deploy-staging:
    name: Deploy Manager to Staging
    runs-on: ubuntu-latest
    needs: [merge-manifests]
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Deploy to staging
      run: |
        echo "Deploying manager to staging environment"
        # Add staging deployment commands here
        # This could include:
        # - Updating Kubernetes deployments
        # - Triggering ArgoCD sync
        # - Running deployment scripts

  deploy-production:
    name: Deploy Manager to Production
    runs-on: ubuntu-latest
    needs: [merge-manifests]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Deploy to production
      run: |
        echo "Deploying manager to production environment"
        # Add production deployment commands here
        # This could include:
        # - Updating Kubernetes deployments
        # - Blue/green deployment
        # - Database migrations