name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      with:
        fetch-depth: 0

    - name: Determine version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
          TAG="${{ github.event.inputs.version }}"
        else
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
        fi

        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "Releasing version: $VERSION"

    - name: Validate version format
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
          echo "Invalid version format: $VERSION"
          echo "Expected format: X.Y.Z or X.Y.Z.B"
          exit 1
        fi

    - name: Check version file consistency
      run: |
        if [ -f .version ]; then
          FILE_VERSION=$(cat .version)
          if [ "v$FILE_VERSION" != "${{ steps.version.outputs.tag }}" ]; then
            echo "Version mismatch: tag=${{ steps.version.outputs.tag }}, file=v$FILE_VERSION"
            exit 1
          fi
        else
          echo "Warning: .version file not found"
        fi

  build-release-artifacts-platform:
    name: Build Release Artifacts - ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: [validate-release]

    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Set up QEMU
      uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

    - name: Log in to Container Registry
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Determine platform tag
      id: platform-tag
      run: |
        PLATFORM_TAG=$(echo "${{ matrix.platform }}" | sed 's|/|-|g')
        echo "tag=${PLATFORM_TAG}" >> $GITHUB_OUTPUT

    - name: Build and push manager image
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
      with:
        context: .
        target: manager
        platforms: ${{ matrix.platform }}
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/manager:${{ needs.validate-release.outputs.tag }}-${{ steps.platform-tag.outputs.tag }}
        cache-from: type=gha,scope=release-manager-${{ matrix.platform }}
        cache-to: type=gha,scope=release-manager-${{ matrix.platform }},mode=max

    - name: Build and push proxy image
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
      with:
        context: .
        target: proxy
        platforms: ${{ matrix.platform }}
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/proxy:${{ needs.validate-release.outputs.tag }}-${{ steps.platform-tag.outputs.tag }}
        cache-from: type=gha,scope=release-proxy-${{ matrix.platform }}
        cache-to: type=gha,scope=release-proxy-${{ matrix.platform }},mode=max

  merge-release-manifests:
    name: Merge Release Manifests
    runs-on: ubuntu-latest
    needs: [validate-release, build-release-artifacts-platform]

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Log in to Container Registry
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

    - name: Create manager manifest
      run: |
        docker buildx imagetools create \
          -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/manager:${{ needs.validate-release.outputs.tag }} \
          -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/manager:latest \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/manager:${{ needs.validate-release.outputs.tag }}-linux-amd64 \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/manager:${{ needs.validate-release.outputs.tag }}-linux-arm64

    - name: Create proxy manifest
      run: |
        docker buildx imagetools create \
          -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/proxy:${{ needs.validate-release.outputs.tag }} \
          -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/proxy:latest \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/proxy:${{ needs.validate-release.outputs.tag }}-linux-amd64 \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/proxy:${{ needs.validate-release.outputs.tag }}-linux-arm64

  create-release-binaries:
    name: Create Release Binaries
    runs-on: ubuntu-latest
    needs: [validate-release]
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
      with:
        go-version: '1.21'

    - name: Create releases directory
      run: mkdir -p releases

    - name: Build proxy binary
      run: |
        cd proxy
        GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build \
          -ldflags="-w -s -X main.version=${{ needs.validate-release.outputs.version }}" \
          -o ../releases/marchproxy-proxy-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }} \
          ./cmd/proxy

    - name: Build health check binary
      run: |
        cd proxy
        GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build \
          -ldflags="-w -s -X main.version=${{ needs.validate-release.outputs.version }}" \
          -o ../releases/marchproxy-health-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }} \
          ./cmd/health

    - name: Build metrics binary
      run: |
        cd proxy
        GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build \
          -ldflags="-w -s -X main.version=${{ needs.validate-release.outputs.version }}" \
          -o ../releases/marchproxy-metrics-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }} \
          ./cmd/metrics

    - name: Create binary archive
      run: |
        cd releases
        if [ "${{ matrix.os }}" = "windows" ]; then
          zip marchproxy-${{ needs.validate-release.outputs.tag }}-${{ matrix.os }}-${{ matrix.arch }}.zip \
            marchproxy-*-${{ matrix.os }}-${{ matrix.arch }}.exe
        else
          tar -czf marchproxy-${{ needs.validate-release.outputs.tag }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz \
            marchproxy-*-${{ matrix.os }}-${{ matrix.arch }}
        fi

    - name: Upload binary artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
      with:
        name: release-binaries-${{ matrix.os }}-${{ matrix.arch }}
        path: releases/marchproxy-${{ needs.validate-release.outputs.tag }}-${{ matrix.os }}-${{ matrix.arch }}.*

  test-release:
    name: Test Release
    runs-on: ubuntu-latest
    needs: [merge-release-manifests, validate-release]

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Test release images
      run: |
        # Pull the release images
        docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/manager:${{ needs.validate-release.outputs.tag }}
        docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/proxy:${{ needs.validate-release.outputs.tag }}

        # Start services with release images
        export MANAGER_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/manager:${{ needs.validate-release.outputs.tag }}
        export PROXY_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/proxy:${{ needs.validate-release.outputs.tag }}

        docker-compose -f docker-compose.yml -f docker-compose.ci.yml up -d

        # Wait for services
        sleep 60

        # Test endpoints
        curl -f http://localhost:8000/health || exit 1
        curl -f http://localhost:8080/healthz || exit 1
        curl -f http://localhost:8090/metrics || exit 1

        # Cleanup
        docker-compose down -v

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [merge-release-manifests, validate-release, create-release-binaries, test-release]

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Download all binary artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
      with:
        path: artifacts

    - name: Prepare release assets
      run: |
        mkdir -p release-assets
        find artifacts -name "*.tar.gz" -o -name "*.zip" | xargs -I {} cp {} release-assets/

        # Generate checksums
        cd release-assets
        sha256sum * > checksums.txt

    - name: Extract changelog for version
      id: changelog
      run: |
        VERSION="${{ needs.validate-release.outputs.version }}"

        # Create release notes
        echo "## Docker Images" > release-notes.md
        echo "- Manager: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/manager:${{ needs.validate-release.outputs.tag }}\`" >> release-notes.md
        echo "- Proxy: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/proxy:${{ needs.validate-release.outputs.tag }}\`" >> release-notes.md
        echo "" >> release-notes.md
        echo "## Installation" >> release-notes.md
        echo "\`\`\`bash" >> release-notes.md
        echo "# Using Docker Compose" >> release-notes.md
        echo "export MANAGER_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/manager:${{ needs.validate-release.outputs.tag }}" >> release-notes.md
        echo "export PROXY_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/proxy:${{ needs.validate-release.outputs.tag }}" >> release-notes.md
        echo "docker-compose up -d" >> release-notes.md
        echo "\`\`\`" >> release-notes.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3
      with:
        tag_name: ${{ needs.validate-release.outputs.tag }}
        name: Release ${{ needs.validate-release.outputs.tag }}
        body_path: release-notes.md
        files: release-assets/*
        draft: false
        prerelease: ${{ contains(needs.validate-release.outputs.tag, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}